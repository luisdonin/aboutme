<!DOCTYPE html>

    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- add responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      /* gallery-specific rules: responsive grid and aspect-ratio wrappers */
      :root { --gap: 16px; --card-bg: #fff; }
      html,body { height:100%; }
      body { box-sizing: border-box; overflow-x: hidden; }

      .layout {
        display: flex;
        min-height: 100vh;
        gap: var(--gap);
      }

      /* Sidebar is expected to be styled from the unified stylesheet;
         keep .sidebar width modest so main has room. */
      .sidebar { flex: 0 0 260px; /* fallback width */ }

      .content {
        flex: 1 1 auto;
        padding: 28px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: var(--gap);
        align-items: start;
      }

      .video-card {
        background: var(--card-bg, #fff);
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .video-wrapper {
        position: relative;
        width: 100%;
        padding-top: 56.25%; /* 16:9 */
        background: #000;
      }

      .video-wrapper iframe {
        position: absolute;
        top:0; left:0; width:100%; height:100%;
        border:0;
      }

      .video-meta {
        padding: 12px 14px;
        font-size: 0.95rem;
      }

      /* prevent long titles or elements from causing horizontal scroll */
      .content, .video-card, .video-meta { box-sizing: border-box; }
      img, iframe { max-width: 100%; display: block; }

      /* small responsive adjustments: stack layout on narrow screens */
      @media (max-width: 720px) {
        .layout { flex-direction: column; }
        .sidebar { flex: 0 0 auto; width: 100%; }
        .content { padding: 16px; }
      }
    </style>
</head>

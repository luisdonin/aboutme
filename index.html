<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>16-bit Starfield</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #000; /* base space color */
            overflow: hidden; /* prevent scrollbars when canvas is transformed */
        }
        /* Full-viewport canvas. We'll render a low-res buffer and scale it up for a pixelated look */
        canvas#starfield {
            display: block;
            position: fixed;
            inset: 0; /* top:0; right:0; bottom:0; left:0; */
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* keep stars blocky when scaled */
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.2) 60%, #000 100%);
            will-change: transform, filter;
            transform-origin: center center;
            /* slight hardware-accelerated transform and blur for parallax depth */
            transform: translate3d(0,0,0);
            filter: blur(2px) saturate(1.02);
        }

        /* Overlay container centered on screen */
        .center-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20; /* above the canvas */
            text-align: center;
            color: #dfefff;
            pointer-events: auto;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Sci-fi heading style */
        .center-overlay h1 {
            font-family: 'Orbitron', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0 0 0.25rem 0;
            font-size: 1.25rem;
            color: #cfe8ff;
            text-transform: uppercase;
            text-shadow:
                    0 0 8px rgba(159, 219, 255, 0.18),
                    0 0 18px rgba(120, 200, 255, 0.08),
                    0 1px 0 rgba(0,0,0,0.6);
        }

        .center-overlay .subtitle {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #9fbfe0;
            opacity: 0.9;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        /* Simple futuristic nav */
        nav.center-nav {
            display: inline-block;
            background: rgba(8, 12, 20, 0.45);
            border: 1px solid rgba(160,220,255,0.06);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        nav.center-nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 0.65rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav.center-nav a {
            color: #e6f6ff;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.25rem 0.45rem;
            border-radius: 6px;
            transition: all 160ms ease;
            display: inline-block;
            font-family: 'Orbitron', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            letter-spacing: 0.8px;
        }

        nav.center-nav a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(50,150,255,0.08), inset 0 0 8px rgba(160,220,255,0.03);
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
        }

        /* Make sure overlay doesn't overflow small screens */
        @media (max-width: 520px) {
            /* allow the viewport to scroll on small devices so fixed overlay can be scrollable */
            html, body {
                overflow: auto;
                -webkit-overflow-scrolling: touch;
            }
            .center-overlay {
                width: 92%;
                max-width: 540px;
                max-height: 90vh;          /* allow content to occupy more of the screen */
                padding: 1rem;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;    /* stack content vertically */
                gap: 0.75rem;
                align-items: center;
                justify-content: center;
                left: 50%;
                transform: translate(-50%, -50%);
                overflow: auto;            /* enable scroll if needed */
                -webkit-overflow-scrolling: touch;
                background: rgba(4,8,14,0.35); /* subtle backdrop to improve contrast on mobile */
                border-radius: 10px;
            }

            .center-overlay > div {      /* header block */
                width: 100%;
                text-align: center;
            }

            .center-overlay h1 { font-size: 1.05rem; margin-bottom: .35rem; }

            nav.center-nav {
                width: 100%;
                padding: 0.5rem;
                border-radius: 8px;
                background: rgba(12,16,24,0.45);
            }

            nav.center-nav ul {
                flex-direction: column;   /* vertical list for easy tapping */
                gap: 0.5rem;
                align-items: stretch;
            }

            nav.center-nav li { width: 100%; }

            nav.center-nav a {
                display: block;           /* full-width touch target */
                width: 100%;
                padding: 0.6rem 0.9rem;   /* larger tap area */
                font-size: 1rem;
                text-align: center;
                border-radius: 8px;
                letter-spacing: 0.6px;
                box-shadow: none;
            }

            nav.center-nav a:hover {
                transform: none;          /* avoid small hover transform that can feel jumpy on touch */
                box-shadow: 0 6px 18px rgba(50,150,255,0.06);
            }
        }
    </style>
</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>

<!-- Centered sci-fi header and navigation overlay -->
<div class="center-overlay" role="banner" aria-hidden="false">
    <div>
        <h1 style="font-size:1.25rem; text-align:center; margin-bottom:.25rem;">J. Luis B. Donin</h1>
        <div class="subtitle">Software & Research</div>
    </div>

    <nav class="center-nav" aria-label="Main navigation">
        <ul>
            <li><a href="barf.html">Binary Analysis and Reverse Engineering Framework</a></li>
            <li><a href="policerepo.html">Police Report Management API</a></li>
            <li><a href="llama.html">Llama Game!</a></li>
            <li><a href="videos.html">Youtube</a></li>
            <li><a href="certificates.html">Certificates</a></li>
        </ul>
    </nav>
</div>

<script>
    // 16-bit style starfield: draw into a low-res offscreen buffer and scale to the visible canvas
    (function () {
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        // Offscreen buffer to draw chunky pixels
        let buffer = document.createElement('canvas');
        let bctx = buffer.getContext('2d');

        let stars = [];
        let animationId = null;

        // Palette of bright colors (limited, retro-feel)
        const PALETTE = [
            '#FFFFFF', // white
            '#FFD27F', // warm
            '#A8D0FF', // cool blue
            '#FFA8FF', // pink
            '#C8FFD0'  // mint
        ];

        function setup() {
            cancelAnimationFrame(animationId);

            // Choose a pixel scale so the buffer is small enough to look blocky but large enough to have detail
            const pixelScale = Math.max(1, Math.floor(Math.min(window.innerWidth, window.innerHeight) / 240));

            // Buffer size in "pixels"
            buffer.width = Math.ceil(window.innerWidth / pixelScale);
            buffer.height = Math.ceil(window.innerHeight / pixelScale);

            // Set visible canvas to full device pixels for crisp scaled rendering
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.floor(window.innerWidth * dpr);
            canvas.height = Math.floor(window.innerHeight * dpr);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';

            // We'll draw the buffer scaled up to the visible canvas
            // Ensure the main context doesn't smooth the scaled image
            ctx.imageSmoothingEnabled = false;

            // Estimate star count from buffer area and a density factor
            const density = 0.0025; // tweak this for sparser/dense fields
            const count = Math.floor(buffer.width * buffer.height * density);

            stars = [];
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * buffer.width,
                    y: Math.random() * buffer.height,
                    // size in buffer pixels (1..2)
                    size: Math.random() < 0.85 ? 1 : 2,
                    color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
                    // phase for twinkle so they don't all pulse together
                    twinklePhase: Math.random() * Math.PI * 2,
                    twinkleSpeed: 0.5 + Math.random() * 1.5,
                    baseAlpha: 0.6 + Math.random() * 0.4
                });
            }

            // Prepare buffer drawing settings (no smoothing)
            bctx.imageSmoothingEnabled = false;

            // Start the animation
            lastTime = performance.now();
            animationId = requestAnimationFrame(loop);
        }

        let lastTime = 0;
        function loop(t) {
            const dt = (t - lastTime) / 1000;
            lastTime = t;

            // Clear buffer (transparent black)
            bctx.clearRect(0, 0, buffer.width, buffer.height);

            // Draw each star as a small filled rectangle (pixelated dot) with twinkling alpha
            for (let s of stars) {
                // twinkle using sine oscillation + small random jitter
                s.twinklePhase += s.twinkleSpeed * dt;
                const tw = 0.5 + 0.5 * Math.sin(s.twinklePhase);
                const alpha = Math.max(0.15, Math.min(1, s.baseAlpha * (0.7 + 0.6 * tw)));

                bctx.fillStyle = s.color;
                bctx.globalAlpha = alpha;

                // Draw a 1x1 or 2x2 pixel block
                bctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);

                // tiny drift for realism (wrap-around)
                s.x += (Math.sin(s.twinklePhase * 0.3) + 0.2 * (Math.random() - 0.5)) * 0.02;
                s.y += (Math.cos(s.twinklePhase * 0.3) + 0.2 * (Math.random() - 0.5)) * 0.02;
                if (s.x < 0) s.x += buffer.width;
                if (s.x >= buffer.width) s.x -= buffer.width;
                if (s.y < 0) s.y += buffer.height;
                if (s.y >= buffer.height) s.y -= buffer.height;
            }

            bctx.globalAlpha = 1;

            // Draw the buffer scaled to the visible canvas
            // Use drawImage to scale up; disable smoothing on ctx already
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw buffer to full canvas size (accounting for devicePixelRatio)
            ctx.drawImage(buffer, 0, 0, buffer.width, buffer.height, 0, 0, canvas.width, canvas.height);

            // subtle overlay to add slight glow to bright stars (cheap)
            // We'll composite a low-alpha white pass to make brightest pixels pop
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = 0.02;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';

            animationId = requestAnimationFrame(loop);
        }

        // Rebuild when resizing
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(setup, 120);
        });

        // Initialize
        setup();
    })();
</script>

<script>
    // Small parallax + blur controller for the background canvas
    (function () {
        const canvas = document.getElementById('starfield');
        if (!canvas) return;

        const strength = 18; // max translation in px
        const lerpFactor = 0.12; // smoothing factor

        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        const lerp = (a, b, t) => a + (b - a) * t;

        function update() {
            currentX = lerp(currentX, targetX, lerpFactor);
            currentY = lerp(currentY, targetY, lerpFactor);
            // slight scale to avoid edge gaps when translating
            canvas.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) scale(1.01)`;
            requestAnimationFrame(update);
        }

        // Mouse-driven parallax
        window.addEventListener('mousemove', (e) => {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const dx = (e.clientX - cx) / cx; // -1 .. 1
            const dy = (e.clientY - cy) / cy;
            targetX = -dx * strength * 0.6;
            targetY = -dy * strength * 0.6;
        }, { passive: true });

        // Device orientation (mobile) fallback
        window.addEventListener('deviceorientation', (ev) => {
            if (ev.gamma == null && ev.beta == null) return;
            // gamma ~ left/right, beta ~ front/back
            const gx = Math.max(-30, Math.min(30, ev.gamma || 0)) / 30; // -1..1
            const gy = Math.max(-30, Math.min(30, (ev.beta || 0) - 10)) / 30; // offset a bit
            targetX = -gx * strength * 0.9;
            targetY = -gy * strength * 0.9;
        }, { passive: true });

        // Reset when leaving window
        window.addEventListener('mouseleave', () => { targetX = 0; targetY = 0; });
        window.addEventListener('blur', () => { targetX = 0; targetY = 0; });

        // Start animation
        update();
    })();
</script>

</body>
</html>

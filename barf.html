<script>
    const repo = "luisdonin/Gerador-de-Chaves-Presente-sem-Instrucoes-de-Maquina-por-Teoria-de-Satisfabilidade-do-Modulo";
    const container = document.getElementById('readme-container');

    async function fetchReadme() {
        try {
            // Fetching the README directly from GitHub's raw content
            const response = await fetch(`https://raw.githubusercontent.com/${repo}/main/README.md`);
            if (!response.ok) throw new Error("Failed to load README");

            const markdown = await response.text();
            // Convert Markdown to HTML and inject
            container.innerHTML = marked.parse(markdown);
        } catch (error) {
            container.innerHTML = `<p style="color: #f85149;">Error: Could not load the repository content. Please check the repo visibility.</p>`;
        }
    }

    fetchReadme();
</script>
